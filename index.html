<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Giới thiệu cá nhân - Nguyễn Thọ Quyền</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #444;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .profile img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        .info {
            line-height: 1.8;
        }

        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <h1>Giới thiệu cá nhân</h1>

    <div class="section">

        <h2>Thông tin cá nhân</h2>

        <div class="profile">

            <img src="avatar.jpg" alt="Ảnh đại diện của Nguyễn Thọ Quyền">

            <div class="info">

                <p>
                    <strong>Họ và tên:</strong>
                    Nguyễn Thọ Quyền
                </p>

                <p>
                    <strong>Mã sinh viên:</strong>
                    24103568
                </p>

                <p>
                    <strong>Ngày sinh:</strong>
                    13/07/2006
                </p>

                <p>
                    <strong>Giới tính:</strong>
                    Nam
                </p>

            </div>

        </div>

    </div>

    <div class="section">

        <h2>Sở thích</h2>

        <ul>
            <li>Đá bóng</li>
        </ul>

    </div>

    <div class="section">

        <h2>Sở trường</h2>

        <ul>
            <li>Ngủ</li>
        </ul>

    </div>

</body>

</html>
